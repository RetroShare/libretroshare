# Ubuntu CMake CI for libretroshare on its own.
#
# libretroshare has a top level CMakeLists.txt of its own -- project(retroshare)
# -- and pulls what it needs through FetchContent: rnp, OpenPGP-SDK, BitDHT,
# rapidjson, restbed, udp-discovery-cpp. So it configures and builds without the
# RetroShare super-project, without submodules and without any graft. Only the
# system libraries below have to be installed.
#
# The jobs `without-fetch` builds libretroshare without the Fetch Dependency
# Provider. All dependencies that are not available from the Ubuntu repository
# are built from source and made available to the build through find_package.
# This is likely the way distro packagers will want to build libretroshare.
#
# Options mirror the Linux CMake job of the super-project, minus everything that
# does not exist in this repository: no GUI, no service, no friendserver, no
# plugins. Everything else is left at the value a normal build uses, so the CI
# compiles what people actually ship -- RS_MINIUPNPC in particular defaults to
# ON, and switching it off to save one package would leave that code untested.
#
# Two deliberate departures: RS_JSON_API is OFF by default here and is turned
# on, since it is the part of the tree most exposed to breakage and the reason
# restbed is fetched at all; RS_WEBUI stays off, as it only serves files the
# super-project provides.
#
# SPDX-License-Identifier: AGPL-3.0-or-later

name: Ubuntu CMake C/C++ CI

on:
  push:
    paths-ignore:
    - '**/*.md'
  pull_request:
    paths-ignore:
    - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  with-fetch:
    name: Ubuntu / CMake / w/ Fetch
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install dependencies
      run: >
        sudo apt-get update &&
        sudo apt-get install -y
        build-essential g++ cmake ninja-build pkg-config git libssl-dev
        zlib1g-dev libbz2-dev libjson-c-dev libbotan-2-dev rapidjson-dev
        libsqlcipher-dev libminiupnpc-dev libasio-dev doxygen python3

    - name: CMake configure
      run: cmake -G Ninja -B Build-cmake -S .
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        -DCMAKE_BUILD_TYPE=Release
        -DRS_RNPLIB=ON -DRS_JSON_API=ON -DRS_WEBUI=OFF
        -DRS_SQLCIPHER=ON -DRS_BITDHT=ON
        -DRS_BRODCAST_DISCOVERY=ON -DRS_MINIUPNPC=ON
        -DRS_FORUM_DEEP_INDEX=OFF
        -DFETCH_DEPENDENCY_PROVIDER=ON

    - name: CMake build
      run: cmake --build Build-cmake -j$(nproc)


  without-fetch:
    name: Ubuntu / CMake / w/o Fetch
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install dependencies
      run: >
        sudo apt-get update &&
        sudo apt-get install -y
        build-essential g++ cmake ninja-build pkg-config git libssl-dev
        zlib1g-dev libbz2-dev libjson-c-dev libbotan-2-dev rapidjson-dev
        libsqlcipher-dev libminiupnpc-dev libasio-dev doxygen python3

    - name: Build BitDHT
      run: |
        git clone https://github.com/RetroShare/BitDHT.git deps/BitDHT
        cd deps/BitDHT
        git remote add dbear496 \
          https://github.com/dbear496/RetroShare_BitDHT.git
        git fetch --all
        git checkout dbear496/cmake-refactor
        cmake -G Ninja -B build -DCMAKE_POSITION_INDEPENDENT_CODE=ON
        cmake --build build -j$(nproc)

    - name: Build restbed
      run: |
        git clone https://github.com/Corvusoft/restbed.git deps/restbed
        cd deps/restbed
        git checkout --detach 6001a322809b5005b8bcccdf593fdda6f0173691
        cmake -G Ninja -B build -DBUILD_TESTS=NO -DBUILD_SSL=NO \
          -DBUILD_STATIC_LIBRARY=YES -DBUILD_SHARED_LIBRARY=NO \
          -DBUILD_DEVEL_PACKAGE=YES \
          --install-prefix=/usr/local -DCMAKE_INSTALL_LIBDIR=lib
        cmake --build build -j$(nproc)
        sudo cmake --install build

    - name: Build rnp
      run: |
        git clone https://github.com/rnpgp/rnp.git --recurse-submodules deps/rnp
        cd deps/rnp
        cmake -G Ninja -B build
        cmake --build build -j$(nproc)
        sudo cmake --install build

    - name: Build sam3
      run: |
        git clone https://github.com/i2p/libsam3.git deps/libsam3
        cd deps/libsam3
        git config set --append \
          remote.origin.fetch '+refs/pull/*/head:refs/remotes/origin/pr/*'
        git fetch
        git checkout origin/pr/30
        LDFLAGS=-fPIC make -j$(nproc)

    - name: Build udp-discovery-cpp
      run: |
        git clone https://github.com/truvorskameikin/udp-discovery-cpp.git \
          deps/udp-discovery-cpp
        cd deps/udp-discovery-cpp
        cmake -G Ninja -B build -DCMAKE_POSITION_INDEPENDENT_CODE=ON
        cmake --build build -j$(nproc)

    - name: CMake configure
      run: cmake -G Ninja -B Build-cmake -S .
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        -DCMAKE_BUILD_TYPE=Release
        -DRS_RNPLIB=ON -DRS_JSON_API=ON -DRS_WEBUI=OFF
        -DRS_SQLCIPHER=ON -DRS_BITDHT=ON
        -DRS_BRODCAST_DISCOVERY=ON -DRS_MINIUPNPC=ON
        -DRS_FORUM_DEEP_INDEX=OFF
        -DRS_USE_I2P_SAM3=ON
        -DFETCH_DEPENDENCY_PROVIDER=OFF
        -DBITDHT_ROOT=$(realpath deps/BitDHT/build)
        -DSAM3_ROOT=$(realpath deps/libsam3)
        -DUDP-DISCOVERY-CPP_ROOT=$(
          realpath deps/udp-discovery-cpp{,/build} | tr '\n' ';')

    - name: CMake build
      run: cmake --build Build-cmake -j$(nproc)
